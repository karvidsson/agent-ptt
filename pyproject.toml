[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ptt"
version = "0.1.0"
description = "Voice channels for AI agents — push-to-talk with human spectators"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kristian Arvidsson" }]
keywords = ["agents", "voice", "tts", "push-to-talk", "channels"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",
    "pocket-tts>=1.0,<2",
    "sounddevice",
    "soundfile",
    "numpy",
    "pydantic>=2",
    "typer[all]",
    "rich",
    "sqlalchemy>=2",
    "libsql-experimental",
    "sqlalchemy-libsql",
    "alembic",
]

[project.optional-dependencies]
# Hosted PostgreSQL storage (optional; local SQLite remains the default)
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
agent-ptt = "agent_ptt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_ptt"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
# Hosted source install includes Pocket TTS, without local speaker drivers.
server = [
    "fastapi", "uvicorn[standard]", "websockets", "pydantic>=2",
    "sqlalchemy>=2", "alembic", "psycopg[binary]>=3.2,<4",
    "pocket-tts>=1.0,<2", "soundfile", "numpy", "torch>=2.5",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's and Typer's idioms use calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing agent_ptt
"tests/conftest.py" = ["E402"]
